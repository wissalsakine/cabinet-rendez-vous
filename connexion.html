<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Cabinet Santé</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- HEADER -->

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                <span>+</span> Cabinet Santé
            </a>

            <nav class="menu">

                <a href="index.html">
                    Accueil
                </a>

                <a href="index.html#services">
                    Services
                </a>

                <a href="index.html#about">
                    À propos
                </a>

                <a href="rendez-vous.html">
                    Rendez-vous
                </a>

            </nav>

            <div class="auth-buttons">

                <a href="inscription.html" class="btn-primary">
                    Inscription
                </a>

            </div>

        </div>

    </header>



    <!-- CONNEXION -->

    <main class="auth-page">

        <div class="auth-container">


            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>
                    Bon retour !
                </h1>

                <p>
                    Connectez-vous à votre espace patient.
                </p>

            </div>



            <form id="loginForm" class="auth-form">


                <div class="form-group">

                    <label for="loginEmail">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="loginPassword">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>



                <div id="loginMessage"></div>



                <button
                    type="submit"
                    class="btn-primary form-button"
                >
                    Se connecter
                </button>


            </form>



            <div class="auth-footer">

                <p>

                    Vous n'avez pas encore de compte ?

                    <a href="inscription.html">
                        Créer un compte
                    </a>

                </p>

            </div>


        </div>

    </main>



    <footer class="simple-footer">

        © 2026 Cabinet Santé - Tous droits réservés.

    </footer>



    <script src="js/script.js"></script>

</body>
</html>
