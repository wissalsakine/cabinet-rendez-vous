<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Cabinet Santé</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                <span>+</span> Cabinet Santé
            </a>

            <nav class="menu">
                <a href="index.html">Accueil</a>
                <a href="index.html#services">Services</a>
                <a href="index.html#about">À propos</a>
                <a href="rendez-vous.html">Rendez-vous</a>
            </nav>

            <div class="auth-buttons">

                <a href="connexion.html" class="btn-login">
                    Connexion
                </a>

            </div>

        </div>

    </header>


    <!-- INSCRIPTION -->

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <div class="auth-icon">
                    +
                </div>

                <h1>
                    Créer un compte
                </h1>

                <p>
                    Inscrivez-vous pour prendre vos rendez-vous
                    facilement.
                </p>

            </div>


            <form id="registerForm" class="auth-form">

                <div class="form-group">

                    <label for="name">
                        Nom complet
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Ex : Wissal Sakine"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Téléphone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="+212 6 00 00 00 00"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 caractères"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirmez votre mot de passe"
                        required
                    >

                </div>


                <div id="registerMessage"></div>


                <button type="submit" class="btn-primary form-button">
                    Créer mon compte
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Vous avez déjà un compte ?
                    <a href="connexion.html">
                        Se connecter
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer class="simple-footer">

        © 2026 Cabinet Santé - Tous droits réservés.

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
